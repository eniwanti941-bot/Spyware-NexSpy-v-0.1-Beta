name: Build Android APK with Embedded Layout

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Project Directory Structure & Layout File
      run: |
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/drawable
        
        # Menulis kode activity_main.xml secara otomatis saat build
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#000000"
            android:gravity="center"
            android:orientation="vertical"
            android:padding="24dp">

            <!-- Logo Anonymous -->
            <ImageView
                android:id="@+id/imgLogo"
                android:layout_width="150dp"
                android:layout_height="150dp"
                android:src="@drawable/anonymous_logo"
                android:contentDescription="Anonymous Logo" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="24dp"
                android:text="SYSTEM LOCKED"
                android:textColor="#FF0000"
                android:textSize="24sp"
                android:textStyle="bold" />

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="12dp"
                android:text="Masukkan kode sandi yang valid untuk memulihkan akses perangkat."
                android:textColor="#FFFFFF"
                android:textSize="14sp"
                android:gravity="center" />

        </LinearLayout>
        EOF

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "Gradle wrapper belum tersedia di root repository."
        fi

    - name: Build Debug APK
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          echo "Lewati build karena gradle wrapper belum diinisialisasi."
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
